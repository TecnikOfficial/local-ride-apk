name: Auto Update Release on APK Upload

on:
  push:
    branches:
      - main
    paths:
      - '**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect APK and Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi
          echo "Found APK: $APK"
          # Create release if it doesn't exist, or overwrite existing APK with --clobber
          gh release upload localride "$APK" --clobber || gh release create localride "$APK" --title "LocalRide Android App" --notes "Latest APK release"
